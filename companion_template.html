<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokérole — Player Companion</title>
<style>
:root{--bg:#11151c;--bg2:#171c25;--bg3:#1f2632;--line:#2a3340;--line2:#3a4658;--txt:#e8edf5;--mut:#93a0b4;--acc:#39a0ff;--good:#46c07a;--bad:#e8556b;--gold:#e6b54a;
  --red:#e23b3b;--red2:#b81f1f;--red3:#8c1414}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#5c1414,#360b0b 70%);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;padding:18px 12px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;background:var(--bg);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:6px 8px}
input[type=number]{width:52px}textarea{width:100%;min-height:42px;resize:vertical}
a{color:var(--acc)}.hidden{display:none!important}.spacer{flex:1}.grow{flex:1;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dim{color:var(--mut);font-size:12px}.muted{color:var(--mut)}
/* ---- Pokédex shell ---- */
.pokedex{max-width:1180px;margin:0 auto;background:linear-gradient(160deg,var(--red),var(--red2));border-radius:22px;padding:16px 16px 22px;
  box-shadow:0 0 0 4px #1f8290,0 0 0 7px #103e46,0 22px 60px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -6px 18px rgba(0,0,0,.35);border:2px solid #caa23a;position:relative}
.pdx-top{display:flex;align-items:center;gap:14px;padding:4px 6px 14px;border-bottom:2px solid #caa23a;margin-bottom:14px}
.readout{background:#072414;color:#62f29a;border:2px solid #0a3a1e;border-radius:5px;padding:4px 9px;font-family:ui-monospace,Consolas,monospace;font-size:11px;letter-spacing:1.5px;font-weight:700;box-shadow:inset 0 0 10px rgba(0,0,0,.7),0 0 6px rgba(98,242,154,.25)}
.lens{width:54px;height:54px;border-radius:50%;flex:none;background:radial-gradient(circle at 34% 30%,#cdecff,#4aa6e6 55%,#1d6db0 90%);
  border:5px solid #f4f7fb;box-shadow:0 0 0 3px #2a6aa0,inset 0 3px 8px rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.4)}
.lights{display:flex;gap:9px}.light{width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,.25);box-shadow:inset 0 2px 3px rgba(255,255,255,.5)}
.light.r{background:#ef5350}.light.y{background:#ffca3a}.light.g{background:#66cc6e}
.pdx-title{font-size:17px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);letter-spacing:.3px}
.pdx-title b{color:#ffe08a}
.pdx-sub{font-size:11px;color:#ffd9d9;margin-top:1px;font-weight:500}
.dbtn{background:#2a0d0d;border:1px solid #5a1a1a;color:#ffd9d9;padding:7px 13px;border-radius:20px;font-weight:700;box-shadow:0 2px 0 #3a0e0e}
.dbtn:hover{color:#fff;border-color:#fff}.dbtn.pri{background:#ffce4d;border-color:#caa12f;color:#3a2a08;box-shadow:0 3px 0 #b98e2a}
.screen{background:#0d1016;border-radius:14px;padding:16px;border:5px solid #0f141c;box-shadow:inset 0 0 30px rgba(0,0,0,.78),0 0 0 3px #2fb6c4,0 0 0 7px #caa23a}
.pdx-base{display:flex;align-items:center;gap:18px;padding:16px 12px 6px;margin-top:16px;border-top:2px solid #caa23a}
.pdx-round{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#d2d9e2 68%,#9aa3b0);border:3px solid #8a6d1f;box-shadow:inset 0 2px 5px rgba(255,255,255,.85),0 3px 6px rgba(0,0,0,.45)}
.dpad{position:relative;width:62px;height:62px;flex:none}
.dpad .ring{position:absolute;inset:0;border-radius:50%;border:4px solid #2fb6c4;background:#161b23;box-shadow:0 0 0 3px #103e46,inset 0 0 12px rgba(0,0,0,.6)}
.dpad .ch,.dpad .cv{position:absolute;background:#0b0e14;border-radius:3px}
.dpad .ch{top:50%;left:15%;right:15%;height:15px;transform:translateY(-50%)}
.dpad .cv{left:50%;top:15%;bottom:15%;width:15px;transform:translateX(-50%)}
.dpad .cc{position:absolute;top:50%;left:50%;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fe9f4,#2fb6c4);transform:translate(-50%,-50%)}
.pdx-btns{display:flex;gap:9px}
.pdx-btn{width:32px;height:19px;border-radius:5px;background:linear-gradient(#f2f5f9,#ccd3dc);border:1px solid #9aa3b0;box-shadow:0 2px 3px rgba(0,0,0,.4),inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center;color:#5a6470;font-weight:800;font-size:14px}
.pdx-grille{display:flex;flex-direction:column;gap:3px}.pdx-grille i{display:block;width:46px;height:3px;border-radius:2px;background:rgba(0,0,0,.28)}
.pdx-legs{position:relative;height:20px}
.pdx-legs::before,.pdx-legs::after{content:"";position:absolute;top:0;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:20px solid #dcb44e;filter:drop-shadow(0 3px 2px rgba(0,0,0,.45))}
.pdx-legs::before{left:90px}.pdx-legs::after{left:132px}
/* ---- components ---- */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.btn{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);padding:7px 12px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--acc);color:#fff}.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}label.fld>span{font-weight:600}
h2.sec{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--gold);margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2.sec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold)}
hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.tp{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.tag{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--bg3);border:1px solid var(--line2);color:var(--mut)}
.pbgroup{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:150px}
.pbhead{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pts{font-weight:800;color:var(--good)}.pts.over{color:var(--bad)}
.statline{display:flex;align-items:center;gap:6px;padding:2px 0}.statline .nm{flex:1;font-size:13px}.statline .v{width:22px;text-align:center;font-weight:800}
.stepper{display:inline-flex;gap:4px}.stepper button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:var(--bg3);color:var(--txt);font-weight:700;line-height:1}
.skillgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 14px}
.pkball{display:inline-block;width:15px;height:15px;border-radius:50%;border:2px solid #47536a;background:#161d29;cursor:pointer;vertical-align:middle;position:relative;transition:transform .08s;flex:none}
.pkball:active{transform:scale(.86)}
.pkball.on{border-color:#0c0f14;background:linear-gradient(#e8503f 0 46%,#111 46% 54%,#f3f3f3 54% 100%);box-shadow:0 0 5px rgba(232,80,63,.7)}
.pkball.on::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;background:#fff;border:1.5px solid #111;transform:translate(-50%,-50%)}
.rlbar{position:fixed;left:8px;right:8px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(#1c2735,#141c27);border:1px solid #2f3f52;border-radius:12px;padding:8px 12px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.rlbar .rlgo{margin-left:auto}.rlbar .rlhint{color:#6f7d92;font-size:12px}
.rlbar .rlpick{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rlbar .rlplus{color:#6f7d92}.rlbar .rleq{color:#8fd0ff;font-size:15px}.rlbar .rlenv{color:#6fcf7f;font-size:11px}
.rlbar .rlclr{padding:2px 7px}
.die.tmbl{animation:dieTmbl .2s ease-in-out infinite;box-shadow:0 0 7px rgba(202,162,58,.75)}
@keyframes dieTmbl{0%,100%{transform:translateY(0) rotate(-10deg) scale(1.05)}50%{transform:translateY(-3px) rotate(10deg) scale(1.05)}}
/* 🎲 floating roll log — always on screen, docked right, so players see every roll anywhere */
.dicelog{position:fixed;right:6px;top:calc(70px + env(safe-area-inset-top,0px));z-index:63;width:min(74vw,272px);background:rgba(18,25,34,.92);border:1px solid #33455a;border-radius:10px;padding:6px 9px;box-shadow:0 5px 16px rgba(0,0,0,.5);backdrop-filter:blur(3px);font-size:12px;cursor:pointer}
.dicelog .dl-h{font-size:8.5px;color:#7a8697;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px;display:flex;justify-content:space-between}
.dicelog .rfe{display:flex;align-items:center;gap:5px;padding:2px 0;border-top:1px solid rgba(255,255,255,.06)}
.dicelog .rfe:first-of-type{border-top:none}
.dicelog .dl-who{font-weight:700;color:#9fe3ff;max-width:50px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dicelog .dl-lbl{color:#8a94a2;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.dicelog .dice{display:flex;gap:2px;margin-left:auto}
.dicelog .dl-s{font-weight:700;color:#5fd07a;min-width:20px;text-align:right}
.dicelog .die{min-width:21px;height:21px;font-size:13px;padding:0 2px;border-radius:5px}
.rlgrid{display:flex;flex-wrap:wrap;gap:5px}
.rlchip{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:20px;background:#1a2431;border:1px solid #2c3a4a;cursor:pointer;font-size:12px;transition:transform .08s}
.rlchip:active{transform:scale(.96)}.rlchip.on{background:#243b2a;border-color:#3fb37f}
.rlchip .pkball{width:12px;height:12px}
.roll-card .rlbarbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#0e151d;border:1px solid #243240;border-radius:10px;padding:8px 10px}
.attrgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center}
.attrgrid .a{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 2px}.attrgrid .a .n{font-size:11px;color:var(--mut)}.attrgrid .a .v{font-size:18px;font-weight:800}.attrgrid .a .mx{font-size:10px;color:var(--mut)}
.mon{background:var(--bg2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:12px;margin-bottom:12px}
.mvbtn{background:var(--bg3);border:1px solid var(--line2);border-radius:7px;padding:3px 8px;font-size:12px;margin:2px 2px 0 0;display:inline-block}
.hpbar{height:15px;border-radius:8px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;position:relative;flex:1;min-width:120px}
.hpbar>i{display:block;height:100%;background:linear-gradient(90deg,#46c07a,#5ad398)}.hpbar.mid>i{background:linear-gradient(90deg,#e0a13c,#f0bd5e)}.hpbar.low>i{background:linear-gradient(90deg,#e0556b,#ff7a8c)}
.hpbar>span{position:absolute;inset:0;text-align:center;font-size:11px;font-weight:700;line-height:15px;text-shadow:0 1px 2px #000}
.learn h4{margin:8px 0 3px;font-size:11px;color:var(--acc);text-transform:uppercase}
.dexnum{font-family:ui-monospace,Consolas,monospace;color:var(--mut);font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.75);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;padding:16px}
.note{font-size:12px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.loci{padding:6px 9px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
.loci:hover{background:var(--bg3)}
img.spr{vertical-align:middle;image-rendering:pixelated}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2a3340;border-radius:6px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>.livepill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;margin-left:6px;white-space:nowrap;align-self:center}.livepill.off{background:#3a3f4b;color:#aeb6c2}.livepill.on{background:#1f7a4d;color:#d9ffe9}.livepill.err{background:#7a2f2f;color:#ffd9d9}
.screen{position:relative}
#battlescape{position:absolute;inset:0;z-index:4;overflow:hidden;pointer-events:none}.battle-overlay{position:absolute;inset:0;background:rgba(10,14,22,.5);overflow:auto;padding:14px;z-index:5}
.battle-overlay h3{letter-spacing:1px}
.bo-round{text-align:center;color:#9fb4d6;font-size:11px;margin:6px 0 10px}
.bo-cbt{display:flex;align-items:center;gap:7px;background:#141a26;border:1px solid #232c3d;border-left:4px solid #444;border-radius:8px;padding:6px 9px;margin-bottom:6px}
.bo-cbt.ally{border-left-color:#57d398}.bo-cbt.enemy{border-left-color:#e5616a}.bo-cbt.neutral,.bo-cbt.wild{border-left-color:#c7b78b}
.bo-cbt.turn{box-shadow:0 0 0 2px #f3d23b;background:#1c2740}
.bo-cbt.fainted{opacity:.45;filter:grayscale(1)}
.bo-cbt .nm{font-weight:700}
.bspr{image-rendering:pixelated;vertical-align:middle}
.bo-cbt .bspr{flex:0 0 auto}
.bo-act{margin-top:10px;padding:8px;border:1px solid #2fa36a55;border-radius:8px;background:#10301f55;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bo-arena{margin:8px 0;display:flex;flex-direction:column;gap:6px}
.bo-arena.biome-forest{background:radial-gradient(circle at 50% 28%,#21402a,#0b1610);border-radius:10px}
.bo-arena.biome-cave{background:radial-gradient(circle at 50% 28%,#2a2630,#090a0d);border-radius:10px}
.bo-arena.biome-water{background:radial-gradient(circle at 50% 28%,#16374f,#08131f);border-radius:10px}
.bo-arena.biome-grass{background:radial-gradient(circle at 50% 28%,#2c4a2a,#0f180e);border-radius:10px}
.bo-arena.biome-city{background:radial-gradient(circle at 50% 28%,#33373f,#121316);border-radius:10px}
.bo-arena.biome-desert{background:radial-gradient(circle at 50% 28%,#4a3f24,#1a160d);border-radius:10px}
.bo-arena.biome-mountain{background:radial-gradient(circle at 50% 28%,#34404a,#13181d);border-radius:10px}
.bo-arena.biome-snow{background:radial-gradient(circle at 50% 28%,#3a4654,#141a20);border-radius:10px}
.bo-arena.biome-volcanic{background:radial-gradient(circle at 50% 28%,#4a2620,#180a08);border-radius:10px}.bo-arena.biome-jungle{background:radial-gradient(circle at 50% 28%,#173a22,#08150d);border-radius:10px}.bo-arena.biome-swamp{background:radial-gradient(circle at 50% 28%,#2a3320,#111509);border-radius:10px}.bo-arena.biome-indoor{background:radial-gradient(circle at 50% 22%,#242838,#0e1018);border-radius:10px}
.bo-arena.biome-indoor{background:radial-gradient(circle at 50% 28%,#3a3340,#16131a);border-radius:10px}
.bo-foes,.bo-allies{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;min-height:104px}
.bo-foes{align-items:flex-start}.bo-allies{align-items:flex-end}
.bo-team{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;border-top:2px solid;border-radius:8px;padding:15px 7px 5px;position:relative;margin:2px}
.bo-team-lbl{position:absolute;top:0;left:0;font-size:9px;font-weight:700;color:#fff;padding:0 6px;border-radius:8px 0 6px 0}
.bm{display:flex;flex-direction:column;align-items:center;gap:2px;width:122px}
.bo-allies .bm{flex-direction:column-reverse}
.bm-spr{height:88px;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bm-spr .bspr{filter:drop-shadow(0 4px 5px rgba(0,0,0,.55))}
.bm.ko .bm-spr{opacity:.35;filter:grayscale(1)}
.bm.act .bm-spr .bspr{filter:drop-shadow(0 0 9px #f3d23b)}
.bm.daze .bm-spr{animation:bmdz .8s ease-in-out infinite}
@keyframes bmdz{0%,100%{transform:translateX(-2px) rotate(-2deg)}50%{transform:translateX(2px) rotate(2deg)}}
.bm-box{width:116px;background:#0d1420ee;border:1px solid #2a3850;border-radius:7px;padding:3px 7px;font-size:11px;line-height:1.3}
.bm.act .bm-box{border-color:#f3d23b;box-shadow:0 0 0 1px #f3d23b66}
.bm-nm{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm-hp{display:block;height:7px;background:#2a3242;border-radius:4px;overflow:hidden;margin:2px 0;position:relative}
.bm-hp b.gh{position:absolute;left:0;top:0;height:100%;display:block;background:rgba(230,110,125,.55);transition:width .9s cubic-bezier(.2,.75,.25,1) .45s;border-radius:inherit} /* trailing damage-ghost */
.bm-hp i{display:block;height:100%;position:relative;z-index:1;background:linear-gradient(90deg,#3fae6e,#57d398);transition:width .35s cubic-bezier(.25,.8,.3,1)}
.bm-hp.mid i{background:linear-gradient(90deg,#caa23a,#f3d23b)}.bm-hp.low i{background:linear-gradient(90deg,#b23a3a,#e5616a)}
.bm-hp.low{animation:hplowP 1.15s ease-in-out infinite}
@keyframes hplowP{0%,100%{box-shadow:0 0 0 0 rgba(255,90,110,0)}50%{box-shadow:0 0 6px 1px rgba(255,90,110,.6)}}
@keyframes despPulseP{0%,100%{box-shadow:0 0 0 0 rgba(200,45,45,.12)}50%{box-shadow:0 0 10px 2px rgba(225,55,55,.72)}}
.bm{position:relative}
.dmgpop{position:absolute;top:2px;right:8px;z-index:30;font-size:19px;font-weight:800;color:#ff8a97;text-shadow:0 2px 8px rgba(0,0,0,.85);pointer-events:none;animation:dpopP 1.05s ease-out forwards}
.dmgpop.crit{color:#ffd76a;font-size:23px}
@keyframes dpopP{0%{opacity:0;transform:translateY(6px) scale(.7)}12%{opacity:1;transform:translateY(0) scale(1.15)}25%{transform:translateY(-3px) scale(1)}100%{opacity:0;transform:translateY(-30px) scale(1)}}
/* ⚡ reaction strip — non-obtrusive: pinned to the top, never blocks the page. .mine = your own minimized dodge choice (red, pulsing) */
.reactbar{position:fixed;top:0;left:0;right:0;z-index:70;display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 10px calc(7px);padding-top:calc(7px + env(safe-area-inset-top,0px));background:rgba(16,20,28,.96);border-bottom:1px solid #2b3a55;box-shadow:0 3px 14px rgba(0,0,0,.5);font-size:12.5px;animation:reactIn .22s ease-out}
.reactbar.mine{background:#2a1216;border-bottom-color:#a03a4a;animation:reactIn .22s ease-out,hplowP 1.1s ease-in-out infinite}
.reactbar span{flex:1;min-width:120px}
@keyframes reactIn{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.bm.panic{animation:bmPanic 1.1s ease-in-out infinite} /* YOUR mon in the red — the phone won't let you miss it */
@keyframes bmPanic{0%,100%{box-shadow:0 0 0 0 rgba(255,80,100,0)}50%{box-shadow:0 0 12px 2px rgba(255,80,100,.65)}}
/* 🕳️ OUT OF REACH (Dig / Fly / Dive / Phantom Force charge) — players kept attacking a mon that had vanished. Now it visibly burrows away + dims + labels, so nobody wastes an attack on empty air. */
.bm.oor .bm-spr{animation:bmBurrow .55s ease-out both;filter:brightness(.45) saturate(.5) blur(.4px);opacity:.4}
@keyframes bmBurrow{0%{transform:translateY(0) scale(1)}55%{transform:translateY(34px) scale(.82)}100%{transform:translateY(26px) scale(.85)}}
.bm.oor .oorlbl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;line-height:1.05;background:rgba(28,20,10,.92);color:#f0c860;font-size:11px;font-weight:800;padding:3px 8px;border-radius:9px;border:1px solid #7a5a20;white-space:nowrap;z-index:4;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.5);animation:oorPulse 1.6s ease-in-out infinite}
.bm.oor .oorlbl small{font-size:8px;font-weight:600;opacity:.85;letter-spacing:.3px}

/* 🛠 Crafting Station — a proper workbench, not a bag list */

.bm-stg{display:block;margin-top:2px;line-height:1.5}.sb{display:inline-block;font-size:8.5px;font-weight:800;padding:0 4px;border-radius:6px;margin:1px 2px 0 0;color:#fff}
.pcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:480px;margin:0 auto}
.pcbox{border-radius:10px;padding:7px;border:1px solid #ffffff20;box-shadow:inset 0 1px 9px #00000066}
.pcslot{aspect-ratio:1;background:#00000055;border-radius:8px;display:flex;align-items:center;justify-content:center;border:2px solid transparent}
.pcslot.filled{cursor:pointer}
.pcslot.sel{border-color:#f3d23b;background:#f3d23b26}
.pcslot.empty{opacity:.4}
.pcslot img{width:84%;height:84%;object-fit:contain;image-rendering:pixelated}
@media(hover:hover){.pcslot.filled:hover{border-color:#ffffff66}}
.pcparty .pcslot{background:#3c785930;border-radius:50%}
.dev-body{display:flex;gap:8px;margin-top:8px;align-items:stretch}
.dev-tabs{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.dev-tab{display:flex;flex-direction:column;align-items:center;gap:2px;background:#00000033;border:1px solid #ffffff1c;border-right:3px solid transparent;border-radius:12px 4px 4px 12px;padding:9px 7px;cursor:pointer;color:#aeb6c2;min-width:48px}
.dev-tab.on{background:#3c785926;color:#fff;border-right-color:#57d398;box-shadow:inset 0 0 0 1px #57d39855}
.dev-tab .dt-ic{font-size:18px;line-height:1}
.dev-tab .dt-lbl{font-size:9px;font-weight:800;letter-spacing:.5px}
.dev-screen{flex:1;min-width:0}
.pc-inner{max-width:640px;margin:0 auto}
.page{max-width:100%;margin:0 auto}
.pdx-main{display:flex;gap:12px;align-items:stretch}
.screen{flex:1;min-width:0;height:78vh;min-height:520px;overflow:hidden}
#app{height:100%;overflow-y:auto}
.sidenav{display:flex;flex-direction:column;gap:10px;flex:0 0 auto;padding-top:6px}
.pnav-b{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;padding:13px 6px;border-radius:16px;background:linear-gradient(#3b414c,#262a31);border:1px solid #00000070;box-shadow:0 3px 7px #00000088,inset 0 1px 0 #ffffff1f;color:#c2c9d3;cursor:pointer;font:inherit;transition:transform .1s,box-shadow .1s,background .12s}
.pnav-b .pn-ic{font-size:24px;line-height:1;filter:grayscale(.4);opacity:.85}
.pnav-b .pn-l{font-size:11px;font-weight:800;letter-spacing:.3px}
.pnav-b:active{transform:translateY(1px)}
.pnav-b.on{background:linear-gradient(#37c2d1,#1f95a3);color:#062229;box-shadow:0 0 0 2px #caa23a,0 4px 11px #000000aa,inset 0 1px 0 #ffffff66}
.pnav-b.on .pn-ic{filter:none;opacity:1}
.pnav-b.on .pn-l{color:#06303a}
.roll-card{background:linear-gradient(150deg,#16202b,#0e151d);border:1px solid #243240;border-radius:12px;padding:10px 12px;box-shadow:inset 0 1px 0 #ffffff0d,0 2px 6px #00000044}
.diceset{display:flex;gap:5px;flex-wrap:wrap}
.dice-b{font-weight:800;min-width:44px;background:linear-gradient(#36424f,#212a34);border:1px solid #00000077;box-shadow:0 2px 4px #00000077,inset 0 1px 0 #ffffff1f;color:#e2e8f1}
.dice-b:active{transform:translateY(1px)}
.dexlist{display:flex;flex-direction:column}
.dexrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:pointer;border-bottom:1px solid #1c2531}
.dexrow:active{background:#ffffff14}
@media(hover:hover){.dexrow:hover{background:#ffffff0c}}
.dexn{font-family:'Courier New',monospace;font-size:11px;color:#7f8a99;min-width:52px}
.dex-entry{display:flex;gap:12px;align-items:center;margin-top:8px;background:linear-gradient(135deg,#172230,#0d141d);border:1px solid #26333f;border-radius:14px;padding:12px}
.dex-spr{width:108px;height:108px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#23303f,#0b1118);border-radius:12px;flex:none;box-shadow:inset 0 0 14px #00000088}
.dexrow.locked{opacity:.78}
.silho{display:inline-flex;align-items:center;justify-content:center}
.silho img{filter:brightness(0) saturate(0);opacity:.6}
.dexpager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 4px;position:sticky;top:0;background:#0e1420;z-index:2;border-bottom:1px solid #1c2531;margin-bottom:4px}
.trnrs{display:flex;gap:10px;align-items:flex-end;margin-bottom:2px}
.bo-allies .trnrs{justify-content:flex-end}
.trnr{display:flex;flex-direction:column;align-items:center;gap:1px}
.trnr-spr{filter:drop-shadow(0 2px 3px #0008)}
.trnr-nm{font-size:10px;font-weight:700;color:#cfe0ff;max-width:80px;text-align:center;line-height:1.05}

    const first=!_tourSeen; _tourSeen=true;
    const prevActive=!!(LIVETOURNEY&&LIVETOURNEY.active); LIVETOURNEY=doc.exists?doc.data():null; const active=!!(LIVETOURNEY&&LIVETOURNEY.active);
    const btn=document.getElementById('tourHdrBtn'); if(btn)btn.style.display=active?'':'none';

    if(state.screen==='tournament')render();
  }catch(_twErr){console.warn('tour watch',_twErr);} },err=>console.warn('tour watch',err)); }

/* ===== 🎬 VS card — the walk-out (LO 2026-08-19) ==========================================
   Fires on every screen at once off the combat push, so the table sees the pairing land at the
   same moment the DM does. Each app draws its own sprites from the name+class rather than us
   shipping markup over the wire. It swallows the arena banner for that match and lists the
   conditions itself — two overlays fighting for the top of the screen looked like a bug. */
var _vsSeen=null;
function vsCSS(){ if(document.getElementById('vsCSS'))return;
  var s=document.createElement('style'); s.id='vsCSS';
  s.textContent='#vsFX{position:fixed;inset:0;z-index:9995;display:flex;align-items:center;justify-content:center;'
   +'background:radial-gradient(circle at 50% 45%,rgba(14,20,36,.9),rgba(4,6,12,.96));cursor:pointer}'
   +'#vsFX .vsIn{width:min(820px,94vw);text-align:center}'
   +'#vsFX .vsRd{font:800 12px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.34em;'
   +'text-transform:uppercase;color:#8fa6c4;margin-bottom:20px}'
   +'#vsFX .vsRow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vw,34px)}'
   +'#vsFX .vsSide{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:7px}'
   +'#vsFX .vsPic{width:96px;height:96px;display:flex;align-items:center;justify-content:center;font-size:52px;'
   +'border-radius:50%;background:linear-gradient(160deg,#1b2540,#101728);border:2px solid #35476b;'
   +'box-shadow:0 10px 30px rgba(0,0,0,.55)}'
   +'#vsFX .vsPic img{width:74px;height:74px;image-rendering:pixelated}'
   +'#vsFX .vsNm{font:900 clamp(17px,2.7vw,27px)/1.15 system-ui,-apple-system,Segoe UI,sans-serif;'
   +'color:#f2f7ff;text-shadow:0 3px 16px rgba(0,0,0,.7);overflow-wrap:anywhere}'
   +'#vsFX .vsMt{font:700 11.5px/1 system-ui,sans-serif;color:#8fa6c4;letter-spacing:.06em}'
   +'#vsFX .vsV{flex:0 0 auto;font:900 clamp(30px,6vw,62px)/1 system-ui,-apple-system,Segoe UI,sans-serif;'
   +'color:#ffd15c;text-shadow:0 0 34px rgba(255,196,60,.55),0 4px 14px rgba(0,0,0,.8);letter-spacing:-.02em}'
   +'#vsFX .vsAr{margin-top:22px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}'
   +'#vsFX .vsAr span{font:700 11.5px/1 system-ui,sans-serif;color:#cfe0f2;background:rgba(24,32,52,.85);'
   +'border:1px solid #33415e;border-radius:999px;padding:6px 11px}'
   +'#vsFX .vsHint{margin-top:18px;font:600 10.5px/1 system-ui,sans-serif;color:#5f7189}';
  document.head.appendChild(s); }
function vsPic(name,cls){ try{ if(typeof trainerSprite==='function'){ var sp=trainerSprite(name||'',cls||'',74); if(sp)return sp; } }catch(_s){} return ''; }
function vsCard(o){ try{
  if(!o||!o.a||!o.b)return;
  if(document.hidden)return;
  vsCSS();
  var old=document.getElementById('vsFX'); if(old)old.remove();
  var L=document.createElement('div'); L.id='vsFX';
  var KIND={pc:'🎮',rival:'🆚',gym:'🏅',cast:'🧑',npc:'🧢'};
  var sideHTML=function(x){
    var pic=vsPic(x.name,x.cls)||(KIND[x.kind]||'🧑');
    var meta=[(x.seed?('#'+x.seed):''),(x.rank||'')].filter(Boolean).join(' · ');
    return '<div class="vsSide"><div class="vsPic">'+pic+'</div><div class="vsNm"></div>'
      +(meta?'<div class="vsMt">'+meta+'</div>':'')+'</div>'; };
  L.innerHTML='<div class="vsIn"><div class="vsRd"></div><div class="vsRow">'
    +sideHTML(o.a)+'<div class="vsV">VS</div>'+sideHTML(o.b)+'</div>'
    +(((o.arena||[]).length)?'<div class="vsAr">'+o.arena.map(function(){return '<span></span>';}).join('')+'</div>':'')
    +'<div class="vsHint">click to dismiss</div></div>';
  document.body.appendChild(L);
  /* names and conditions go in as TEXT, never markup — they carry player-authored strings */
  L.querySelector('.vsRd').textContent=o.round||'Next match';
  var nms=L.querySelectorAll('.vsNm'); nms[0].textContent=o.a.name||'?'; nms[1].textContent=o.b.name||'?';
  var chips=L.querySelectorAll('.vsAr span');
  (o.arena||[]).forEach(function(x,i){ if(chips[i])chips[i].textContent=(x.emoji||'')+' '+x.name; });
  var kill=function(){ try{L.remove();}catch(_k){} };
  L.onclick=kill;
  var sides=L.querySelectorAll('.vsSide'), V=L.querySelector('.vsV');
  L.animate([{opacity:0},{opacity:1}],{duration:220,easing:'ease-out'});
  sides[0].animate([{transform:'translateX(-70px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.9,.25,1)'});
  sides[1].animate([{transform:'translateX(70px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:520,easing:'cubic-bezier(.2,.9,.25,1)'});
  V.animate([{transform:'scale(3.2)',opacity:0,offset:0},{transform:'scale(.86)',opacity:1,offset:.55},
             {transform:'scale(1)',opacity:1,offset:.72},{transform:'scale(1)',opacity:1}],
            {duration:760,easing:'cubic-bezier(.2,1.2,.3,1)'});
  var ar=L.querySelector('.vsAr');
  if(ar)ar.animate([{transform:'translateY(14px)',opacity:0},{transform:'translateY(14px)',opacity:0,offset:.45},
                    {transform:'translateY(0)',opacity:1}],{duration:1100,easing:'ease-out'});
  L.animate([{opacity:1,offset:.82},{opacity:0}],{duration:4200,easing:'ease-in'}).onfinish=kill;
  setTimeout(kill,6500);   /* a hidden tab throttles onfinish; the timer does not */
}catch(_vc){} }

/* ===== 💰 Side betting (player side) — ask only; every limit is enforced by the DM ========== */
function betMyStake(T,pvp){ let n=0; const B=(T&&T.bets)||{}; Object.keys(B).forEach(function(k){ const b=(B[k]||{})[state.sync.pid]; if(b&&(!!b.pvp)===(!!pvp))n+=(b.amt||0); }); return n; }
window.tourBet=function(r,m,side){
  const T=LIVETOURNEY; if(!T||!T.bet||!T.bet.on)return;
  const cfg=T.bet, rd=(T.rounds||[])[r], mt=rd&&(rd.matches||[])[m]; if(!mt)return;
  const on=(side==='a')?mt.a:mt.b, price=(mt.odds&&mt.odds[side])||1;
  const isPvp=!!mt.pvp, lim=isPvp?(cfg.maxPvp||cfg.max):cfg.max, tot=isPvp?(cfg.capPvp||cfg.cap):cfg.cap;
  const staked=betMyStake(T,isPvp), room=Math.max(0,tot-staked);
  const purse=(state.trainer&&state.trainer.money)||0;
  const ceiling=Math.min(lim,room,purse);
  if(ceiling<cfg.min){
    showModal('<div class="row" style="justify-content:space-between"><h3 style="margin:0">💰 No bet</h3><button class="btn sm" onclick="closeModal()">✕</button></div>'
     +'<div class="note" style="margin-top:8px;font-size:13px">'
     +(purse<cfg.min?('You have ₽'+purse+' — the minimum stake is ₽'+cfg.min+'.')
       :('You have ₽'+staked+' riding already. The '+(isPvp?'grudge-match':'tournament')+' limit is ₽'+tot+', so there is no room for another bet.'))
     +'</div>'); return; }
  /* a five-grand grudge match wants different rungs than a ₽250 filler */
  const opts=(isPvp?[250,500,1000,2500,5000,ceiling]:[cfg.min,100,250,500,ceiling])
    .filter(function(v,i,arr){ return v>=cfg.min&&v<=ceiling&&arr.indexOf(v)===i; });
  showModal('<div class="row" style="justify-content:space-between"><h3 style="margin:0">💰 Back '+esc(on||'?')+'</h3><button class="btn sm" onclick="closeModal()">✕</button></div>'
   +'<div class="dim" style="font-size:12.5px;margin-top:6px">Paying <b>'+price+'×</b> — a ₽100 bet returns ₽'+Math.round(100*price)+'.</div>'
   +'<div class="row" style="gap:7px;flex-wrap:wrap;margin-top:10px">'
   +opts.map(function(v){ return '<button class="btn pri" onclick="tourBetSend('+r+','+m+',\''+side+'\','+v+')">₽'+v+'</button>'; }).join('')
   +'</div>'
   +(isPvp?'<div style="margin-top:9px;padding:6px 9px;border:1px solid #5a4a1e;border-radius:8px;background:#2a2312;color:#ffd98a;font-size:12px">🆚 <b>Grudge match.</b> Two trainers, same Rank, no favours — the ceiling is ₽'+lim+' here.</div>':'')
   +'<div class="dim" style="font-size:11px;margin-top:10px">Purse ₽'+purse+' · ₽'+staked+' already staked · ₽'+tot+' limit for '+(isPvp?'grudge matches':'the tournament')+'.<br>One bet per match and it cannot be changed. The book shuts when the match goes to the floor.</div>');
};
window.tourBetSend=function(r,m,side,amt){

/* 🆚 Which side of the field is MINE. The companion inferred it from its own combatant,
   which works right up until you have not sent out yet — then it defaulted to 'ally', and the
   player the DM placed on the foe side saw their OPPONENT sitting in their own team slots

const TYPES=['Normal','Fire','Water','Electric','Grass','Ice','Fighting','Poison','Ground','Flying','Psychic','Bug','Rock','Ghost','Dragon','Dark','Steel','Fairy'];
const TYPE_REL={Normal:{nve:['Rock','Steel'],imm:['Ghost']},Fire:{se:['Grass','Ice','Bug','Steel'],nve:['Fire','Water','Rock','Dragon']},Water:{se:['Fire','Ground','Rock'],nve:['Water','Grass','Dragon']},Electric:{se:['Water','Flying'],nve:['Electric','Grass','Dragon'],imm:['Ground']},Grass:{se:['Water','Ground','Rock'],nve:['Fire','Grass','Poison','Flying','Bug','Dragon','Steel']},Ice:{se:['Grass','Ground','Flying','Dragon'],nve:['Fire','Water','Ice','Steel']},Fighting:{se:['Normal','Ice','Rock','Dark','Steel'],nve:['Poison','Flying','Psychic','Bug','Fairy'],imm:['Ghost']},Poison:{se:['Grass','Fairy'],nve:['Poison','Ground','Rock','Ghost'],imm:['Steel']},Ground:{se:['Fire','Electric','Poison','Rock','Steel'],nve:['Grass','Bug'],imm:['Flying']},Flying:{se:['Grass','Fighting','Bug'],nve:['Electric','Rock','Steel']},Psychic:{se:['Fighting','Poison'],nve:['Psychic','Steel'],imm:['Dark']},Bug:{se:['Grass','Psychic','Dark'],nve:['Fire','Fighting','Poison','Flying','Ghost','Steel','Fairy']},Rock:{se:['Fire','Ice','Flying','Bug'],nve:['Fighting','Ground','Steel']},Ghost:{se:['Psychic','Ghost'],nve:['Dark'],imm:['Normal']},Dragon:{se:['Dragon'],nve:['Steel'],imm:['Fairy']},Dark:{se:['Psychic','Ghost'],nve:['Fighting','Dark','Fairy']},Steel:{se:['Ice','Rock','Fairy'],nve:['Fire','Water','Electric','Steel']},Fairy:{se:['Fighting','Dragon','Dark'],nve:['Fire','Poison','Steel']}};
function multOne(atk,def){const r=TYPE_REL[atk];if(!r||!def)return 1;if(r.imm&&r.imm.includes(def))return 0;if(r.se&&r.se.includes(def))return 2;if(r.nve&&r.nve.includes(def))return .5;return 1;}
function effectiveness(atk,defTypes){let m=1;(defTypes||[]).filter(Boolean).forEach(d=>m*=multOne(atk,d));if(m===0)return{immune:true,level:0,label:'No effect — immune'};if(m>=4)return{immune:false,level:2,label:'Doubly super effective'};if(m>=2)return{immune:false,level:1,label:'Super effective'};if(m<=0.25)return{immune:false,level:-2,label:'Doubly resisted'};if(m<=0.5)return{immune:false,level:-1,label:'Not very effective'};return{immune:false,level:0,label:'Neutral'};}

var FBLS='pokerole_fbcfg';
function fbOwn(){ try{ var r=localStorage.getItem(FBLS); return r?JSON.parse(r):null; }catch(_e){ return null; } }
function fbCfg(){ var o=fbOwn(); return (o&&o.apiKey)?o:(DB.firebase||null); }
function fbIsOwn(){ var o=fbOwn(); return !!(o&&o.apiKey); }
/* accepts the whole snippet Firebase shows you, or bare JSON — people paste either */
function fbParseCfg(txt){
  txt=String(txt||'').trim(); if(!txt)return null;
  var m=txt.match(/\{[\s\S]*\}/); if(!m)return null;
  var body=m[0];
  try{ return JSON.parse(body); }catch(_e){}
  /* the console hands out JS object literal form: unquoted keys, single quotes, trailing commas */
  try{
    var j=body.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":')
              .replace(/'/g,'"').replace(/,(\s*[}\]])/g,'$1');
    return JSON.parse(j);
  }catch(_e2){ return null; }
}
function fbCfgOk(c){ return !!(c&&c.apiKey&&c.projectId&&c.appId); }
/* one string a DM can hand their players so nobody else touches a Firebase console */
function fbTableCode(c){ try{ return 'PKRL1.'+btoa(JSON.stringify(c||fbCfg())).replace(/=+$/,''); }catch(_e){ return ''; } }

/* prove it before they walk away: a real write + read + delete against their own project */
function fbTestCfg(c,done){
  try{
    if(typeof firebase==='undefined')return done(false,'Firebase library did not load — check the connection.');
    var app; try{ app=firebase.app('cfgtest'); }catch(_e){ app=firebase.initializeApp(c,'cfgtest'); }
    var db=app.firestore(), ref=db.collection('campaigns').doc('__setup_check__');
    ref.set({ts:Date.now()})
      .then(function(){ return ref.get(); })
      .then(function(d){ return ref.delete().then(function(){ return d; }); })
      .then(function(d){ done(d.exists,d.exists?'':'Wrote, but could not read it back.'); })
      .catch(function(e){
        var m=String((e&&e.code)||e);
        if(/permission-denied/i.test(m))done(false,'Connected, but Firestore refused the write — the rules in step 3 are not saved yet.');
        else if(/not-found|does not exist/i.test(m))done(false,'Project reached, but no Firestore database — finish step 2.');
        else done(false,'Could not reach that project: '+m);

}

/* ===== ☁ CLOUD CHARACTER — the character LIVES in the cloud (LO 2026-07-24, cloud-primary rework same day) =====
   characters/{code} is the character's permanent, ROOM-INDEPENDENT home. The room push
   (campaigns/{room}/players/{pid}) stays an EPHEMERAL live mirror — syncDisconnect DELETES it,
   it's scoped to that night's room code, and it can never be the character's home (that's how
   "Swimmy" got stranded in campaign9). localStorage is a CACHE of the cloud copy.
   CLOUD-PRIMARY ("log in and it's there", LO): on boot, cloudHydrate() pulls the slot — if the
   cloud is newer than this device's last write/apply, it's adopted SILENTLY (that's the login
   feel); if this device is current or ahead (edits from a close mid-debounce), it wins and
   syncs up. After boot, cloudWatch() live-follows the slot, so a second open device tracks

function monTypes(mon){if(!mon)return [];const d=dexByName.get(norm(mon.species))||{};return [d.Type1,d.Type2].filter(Boolean);}
function moveAccPool(mv,mon){if(!mv)return null;const a1=mv.Accuracy1,a2=mv.Accuracy2,parts=[];let n=0;
  if(a1&&a1!=='-'){let v=0;if(a1==='Will')v=mon?maxWill(mon):0;else if(ATTRS.includes(a1))v=(mon&&mon.attrs&&mon.attrs[a1])||0;n+=v;parts.push(a1+(mon?' '+v:''));}
  if(a2&&a2!=='-'){const v=(mon&&mon.skills&&mon.skills[a2])||0;n+=v;parts.push(a2+(mon?' '+v:''));}
  const _m=mv.Effect&&mv.Effect.match(/[-−]\s*(\d+)\s*accuracy/i),_ap=_m?-parseInt(_m[1]):0;
  return {n:Math.max(0,n+_ap+masterSkillDice(mon)),txt:(parts.join(' + ')||'—')+(_ap?` − ${Math.abs(_ap)} acc`:'')};}
function moveDmgPool(mv,mon){if(!mv)return null;const isDmg=(typeof mv.Power==='number'&&mv.Power>0)||ATTRS.includes(mv.Damage1);if(mv.Category==='Support'||!isDmg)return null;
  const d1=mv.Damage1,pow=mv.Power||0,parts=[];let n=0;
  if(d1&&ATTRS.includes(d1)){const v=(mon&&mon.attrs&&mon.attrs[d1])||0;n+=v;parts.push(d1+(mon?' '+v:''));}
  if(pow){n+=pow;parts.push('pow '+pow);}
  if(mon&&monTypes(mon).includes(mv.Type)){n+=1;parts.push('STAB 1');}
  return {n,txt:parts.join(' + ')||'—'};}
function moveDetailHTML(mv,mon){if(!mv)return '';const col=TYPE_COLORS[mv.Type]||'#555',acc=moveAccPool(mv,mon),dmg=moveDmgPool(mv,mon);
  return `<div style="border-left:3px solid ${col};padding:5px 8px;background:#1a1f29;border-radius:6px;margin:0 0 6px">

function benchPanel(lc){const party=state.party||[];if(!party.length)return'';
  const myOut=(lc.order||[]).filter(c=>c.owner===state.sync.pid),outNames=new Set(myOut.map(c=>norm(c.name)));

    else if(!hasActive)btn=` <button class="btn sm pri" onclick="throwOut('${p.id}')" title="Send out now (you have no mon in play)">out</button>`;
    else if(acted)btn=' <span class="dim" title="You already used your trainer action this round (switch or item)">— used</span>';

    else if(noSwap&&hasActive)btn=' <span class="dim" title="This match forbids switching — your Pokemon fights until it drops">🔒 no switching</span>';
    else if(capBlocks(p))btn=' <span class="dim" title="Your picks for this battle are spent — this one cannot come in">🎽 not eligible</span>';
    else btn=` <button class="btn sm pri" onclick="switchEoR('${p.id}')" title="Clean switch at End of Round — comes in fresh, no daze">↩ EoR</button> <button class="btn sm" onclick="throwOut('${p.id}')" title="Switch in NOW — new mon is Dazed (can't act or evade) until next round">⚡ now</button>`;
    return `<span class="bo-pm ${onF?'onf':''} ${ko?'ko':''}">${spriteImg(p.species,20)}${esc(p.nick||p.species)}${btn}</span>`;}).join('')}</div>`;}

{name:"How Reactions Work",tag:"Reactions",body:"A Reaction lets you act when it isn't your turn. ↑ Reactions resolve BEFORE the move that triggered them; ↓ Late Reactions resolve AFTER it. You get one Reaction per turn and it spends one of your Actions. You may only react to answer something used against you — and to counter a Reaction aimed at you, yours must be a strictly HIGHER number. A Late Reaction can only be answered by another Late Reaction."},

/* 🎯 The target picker listed ONLY foes (c.side!==ac.side), so every self- and ally-target move
   showed "no targets" and could not be used at all from a phone -- 93 `User` moves incl. Agility,
   16 `One Ally`, 18 `User and Allies`. The DM engine was always fine: openResolver short-circuits a
   User-target Support move straight into applyMoveEffects(m,att,att), and its default target is
   attId for /^User/. Only the phone's list was wrong. (LO, 2026-08-25.)
   ★ This mirrors the DM's own test so the two cannot disagree: a Support move whose StatChanges
   all Affect the User counts as self-target even when Target says something else. */
function moveIsSelf(mv){
  if(!mv)return false;
  if(/^User$/i.test(mv.Target||''))return true;
  var sc=((mv.AddedEffects||{}).StatChanges)||[];
  return !!(mv.Category==='Support'&&sc.length&&sc.every(function(c){return c.Affects==='User';}));
}
function moveTargetList(mv,ac,lc){
  var all=(lc&&lc.order)||[], live=all.filter(function(c){return !c.fainted;});
  var tgt=(mv&&mv.Target)||'';
  if(moveIsSelf(mv))            return live.filter(function(c){return c.id===ac.id;});
  if(/^User and Allies$/i.test(tgt))
    return live.filter(function(c){return c.side===ac.side&&!c.isTrainer;});
  if(/ally/i.test(tgt))
    return live.filter(function(c){return c.side===ac.side&&c.id!==ac.id&&!c.isTrainer;});
  return live.filter(function(c){return c.side!==ac.side;});
}
function moveTargetLabel(mv,ac,c){
  if(c.id===ac.id)return '↻ Itself';
  return c.name;
}


/* 🔒 Cursed Body (and Disable) locks a move on the DM's copy of the combatant. That list never
   crossed to the phones, so the player kept seeing the move, tapping it, and getting a rejection
   only the DM could read. The snapshot now carries `disabled` per combatant. (LO, 2026-08-25.) */
function moveIsDisabled(ac,mv){
  try{ return !!(ac&&ac.disabled&&ac.disabled.indexOf(mv)>=0); }catch(_e){ return false; }
}

/* ===== 🦏 SAFARI ZONE (player side, LO 2026-08-25) =====================================
   Catching is untouched -- balls go through the existing bag UI, which already consumes at send
   time and is gated to one trainer action per round by the DM. All this adds is the two Safari
   actions and a board, so the phone is never just a spectator between throws. */
let SAFARI=null,_safUnsub=null;

  if(_safUnsub){_safUnsub();_safUnsub=null;}

    .onSnapshot(function(doc){ SAFARI=doc.exists?doc.data():null; try{render();}catch(_r){} },
                function(e){console.warn('safari watch',e);}); }

function safBallCount(){ return ((state.trainer&&state.trainer.bag)||[]).filter(function(i){ return /ball$/i.test(String(i)); }).length; }

/* ===== 🍅 Heckle — the cheap seats (LO 2026-08-19) ==========================================
   Spectators pelt the shared screen. ONE doc, state/heckle, written by whoever throws and watched
   by everyone including the DM, so a tomato lands on every screen at once. It lives in `state`,
   which CG_SUBCOLS already sweeps, so there is no new subcollection to clean up later — same trick
   the Pong channel uses. Throws render locally the instant you fire one and the echo is ignored by
   id, so your own tomato never waits on the round trip. */
var HK_KINDS={
  tomato:{emoji:'🍅',core:'#b8241c',edge:'#e2564a',verb:'lobs a tomato'},
  egg:   {emoji:'🥚',core:'#efe7d2',edge:'#fffdf6',verb:'chucks an egg'},
  cheer: {emoji:'🎉',core:'#ffd15c',edge:'#ffe9a8',verb:'cheers'}
};
var _hkSeen=null,_hkLast=0,_hkUnsub=null;
function hkUid(){ return (typeof uid==='function')?uid():('h'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)); }
function hkCSS(){ if(document.getElementById('hkCSS'))return;
  var s=document.createElement('style'); s.id='hkCSS';
  s.textContent='#hkFX{position:fixed;inset:0;pointer-events:none;z-index:9990;overflow:hidden;contain:layout paint}'
   +'#hkFX>*{position:absolute;will-change:transform,opacity}'
   +'#hkFX .hkFly{font-size:34px;line-height:1;filter:drop-shadow(0 4px 7px rgba(0,0,0,.55))}'
   +'#hkFX .hkRing{border-radius:50%;border:3px solid rgba(255,255,255,.8)}'
   +'#hkFX .hkTag{font:800 12px/1.2 system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.9);white-space:nowrap}'
   +'#hkFX .hkDrip{border-radius:44% 44% 60% 60%/18% 18% 100% 100%}'
   +'#hkFX .hkBit{border-radius:2px}'
   +'#hkFX .hkCheer{left:0;right:0;text-align:center;font:900 clamp(22px,4.6vw,44px)/1.1 system-ui,-apple-system,Segoe UI,sans-serif;color:#ffe9a8;text-shadow:0 3px 15px rgba(0,0,0,.85),0 0 28px rgba(255,196,60,.5)}';
  document.head.appendChild(s); }
function hkLayer(){ hkCSS(); var L=document.getElementById('hkFX');
  if(!L){ L=document.createElement('div'); L.id='hkFX'; document.body.appendChild(L); } return L; }
/* a splat is never the same twice: walk a ring of points, jitter each radius, smooth it with
   quadratics. Cheaper than shipping art and it means no two tomatoes look alike. */
function hkBlob(pts,r0,jit){ var p=[],i,a,r;
  for(i=0;i<pts;i++){ a=i/pts*Math.PI*2; r=r0*(1-jit+Math.random()*jit*2);
    p.push([50+Math.cos(a)*r, 50+Math.sin(a)*r]); }
  var d='M'+((p[0][0]+p[pts-1][0])/2).toFixed(1)+' '+((p[0][1]+p[pts-1][1])/2).toFixed(1);
  for(i=0;i<pts;i++){ var n=p[(i+1)%pts];
    d+=' Q'+p[i][0].toFixed(1)+' '+p[i][1].toFixed(1)+' '+((p[i][0]+n[0])/2).toFixed(1)+' '+((p[i][1]+n[1])/2).toFixed(1); }
  return d+' Z'; }
/* onfinish alone is not a cleanup story: a backgrounded tab throttles Web Animations, so the
   callback can sit unfired while the nodes pile up (measured — 31 still live after 8s in a
   hidden tab). The timer fires either way, so every FX node has a hard expiry. */
function hkKill(el,ms){ var go=function(){ try{el.remove();}catch(_e){} };
  setTimeout(go,ms||6000); return go; }
function hkSplat(o){ try{
  o=o||{}; var K=HK_KINDS[o.kind]||HK_KINDS.tomato, L=hkLayer();
  var W=window.innerWidth||1200, H=window.innerHeight||800;
  var tx=(o.x==null?18+Math.random()*64:o.x)/100*W, ty=(o.y==null?18+Math.random()*54:o.y)/100*H;
  if(o.kind==='cheer'){ hkCheer(L,o,K,W,H); return; }
  /* the throw: in from an edge, spinning, with a bit of arc so it reads as thrown not spawned */
  var side=Math.floor(Math.random()*3);
  var sx=(side===0)?-80:(side===1)?(W+80):(tx+(Math.random()*300-150));
  var sy=(side===2)?(H+80):(ty+(Math.random()*320-160));
  var fly=document.createElement('div'); fly.className='hkFly'; fly.textContent=K.emoji;
  fly.style.left='0px'; fly.style.top='0px'; L.appendChild(fly);
  var spin=(Math.random()<0.5?-1:1)*(520+Math.random()*400);
  var mx=(sx+tx)/2, my=Math.min(sy,ty)-110-Math.random()*90, dur=330+Math.random()*130;
  fly.animate([
    {transform:'translate('+sx.toFixed(0)+'px,'+sy.toFixed(0)+'px) rotate(0deg) scale(.85)'},
    {transform:'translate('+mx.toFixed(0)+'px,'+my.toFixed(0)+'px) rotate('+(spin*0.55).toFixed(0)+'deg) scale(1.06)',offset:0.55},
    {transform:'translate('+tx.toFixed(0)+'px,'+ty.toFixed(0)+'px) rotate('+spin.toFixed(0)+'deg) scale(.62)'}
  ],{duration:dur,easing:'cubic-bezier(.35,.05,.7,1)'}).onfinish=function(){ fly.remove(); hkImpact(L,tx,ty,K,o); };
  setTimeout(function(){ try{fly.remove();}catch(_f){} },2000);
}catch(_hs){} }
function hkImpact(L,tx,ty,K,o){
  var size=86+Math.random()*56, rot=Math.random()*360;
  /* wrapper carries position + the scale bloom; the inner holds the static rotation so the two
     transforms never fight each other in the keyframes */
  var wrap=document.createElement('div');
  wrap.style.left=(tx-size/2)+'px'; wrap.style.top=(ty-size/2)+'px';
  wrap.style.width=size+'px'; wrap.style.height=size+'px';
  var inner=document.createElement('div');
  inner.style.cssText='width:100%;height:100%;transform:rotate('+rot.toFixed(0)+'deg)';
  var svg='<svg viewBox="0 0 100 100" style="width:100%;height:100%;overflow:visible">'
   +'<path d="'+hkBlob(9,33,0.34)+'" fill="'+K.core+'" opacity=".93"/>'
   +'<path d="'+hkBlob(7,19,0.30)+'" fill="'+K.edge+'" opacity=".8"/>';
  for(var i=0;i<8;i++){ var a=Math.random()*Math.PI*2, r=34+Math.random()*30;
    svg+='<circle cx="'+(50+Math.cos(a)*r).toFixed(1)+'" cy="'+(50+Math.sin(a)*r).toFixed(1)+'" r="'+(1.8+Math.random()*5).toFixed(1)+'" fill="'+K.core+'" opacity=".82"/>'; }
  svg+='</svg>'; inner.innerHTML=svg; wrap.appendChild(inner); L.appendChild(wrap);
  wrap.animate([{transform:'scale(.12)',opacity:.25},
                {transform:'scale(1.2)',opacity:1,offset:.18},
                {transform:'scale(1)',opacity:1,offset:.3},
                {transform:'scale(1)',opacity:1,offset:.72},
                {transform:'scale(1)',opacity:0}],
               {duration:4600,easing:'cubic-bezier(.2,.9,.3,1)'}).onfinish=hkKill(wrap,6200);
  /* the glass flexed: a shockwave ring instead of shaking the page, because a transform on a
     container would re-parent every position:fixed overlay in the app */
  var ring=document.createElement('div'); ring.className='hkRing';
  ring.style.left=tx+'px'; ring.style.top=ty+'px'; ring.style.width='10px'; ring.style.height='10px';
  ring.style.marginLeft='-5px'; ring.style.marginTop='-5px'; L.appendChild(ring);
  ring.animate([{transform:'scale(.4)',opacity:.85},{transform:'scale(13)',opacity:0}],
               {duration:520,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=hkKill(ring,2200);
  /* drips: they grow for a beat after the hit, which is what makes it read as wet */
  for(var d=0;d<2+Math.floor(Math.random()*3);d++){
    var dr=document.createElement('div'); dr.className='hkDrip';
    var dw=4+Math.random()*7, dh=14+Math.random()*46;
    dr.style.width=dw+'px'; dr.style.background=K.core; dr.style.opacity='.9';
    dr.style.left=(tx-size*0.3+Math.random()*size*0.6)+'px'; dr.style.top=(ty+size*0.18)+'px';
    dr.style.height='0px'; L.appendChild(dr);
    dr.animate([{height:'0px',opacity:.95},{height:dh+'px',opacity:.9,offset:.35},
                {height:dh+'px',opacity:.9,offset:.72},{height:dh+'px',opacity:0}],
               {duration:4600,easing:'cubic-bezier(.25,.8,.4,1)',fill:'forwards'}).onfinish=hkKill(dr,6200);
  }
  if(o.name){ var tag=document.createElement('div'); tag.className='hkTag';
    tag.textContent=K.emoji+' '+o.name+' '+K.verb;
    tag.style.left=(tx+size*0.34)+'px'; tag.style.top=(ty-size*0.42)+'px'; L.appendChild(tag);
    tag.animate([{transform:'translateY(8px)',opacity:0},{transform:'translateY(0)',opacity:1,offset:.16},
                 {transform:'translateY(0)',opacity:1,offset:.6},{transform:'translateY(-10px)',opacity:0}],
                {duration:2600,easing:'ease-out'}).onfinish=hkKill(tag,4200); }
}
function hkCheer(L,o,K,W,H){
  var txt=document.createElement('div'); txt.className='hkCheer';
  txt.style.top=(H*0.28)+'px'; txt.textContent='📣 '+((o.name||'Someone'))+' cheers!';
  L.appendChild(txt);
  txt.animate([{transform:'translateY(26px) scale(.86)',opacity:0},
               {transform:'translateY(0) scale(1.07)',opacity:1,offset:.2},
               {transform:'translateY(-4px) scale(1)',opacity:1,offset:.62},
               {transform:'translateY(-44px) scale(.98)',opacity:0}],
              {duration:2500,easing:'cubic-bezier(.2,.9,.25,1)'}).onfinish=hkKill(txt,4200);
  var COL=['#ffd15c','#ff6b8a','#7ad9ff','#8ef0a5','#c9a6ff','#ffa45c','#ffffff'];
  for(var i=0;i<28;i++){
    var b=document.createElement('div'); b.className='hkBit';
    b.style.width=(4+Math.random()*7)+'px'; b.style.height=(8+Math.random()*13)+'px';
    b.style.background=COL[i%COL.length];
    b.style.left=(W*(0.08+Math.random()*0.84))+'px'; b.style.top=(H+24)+'px';
    L.appendChild(b);
    b.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},
               {transform:'translate('+(Math.random()*240-120).toFixed(0)+'px,'+(-(H*(0.36+Math.random()*0.52))).toFixed(0)+'px) rotate('+(Math.random()*940-470).toFixed(0)+'deg)',opacity:0}],
              {duration:1700+Math.random()*950,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=hkKill(b,4200);
  }
}
function fbWatchHeckle(){ var db=fbInit(); if(!db||!state.sync.room)return;
  if(_hkUnsub){ try{_hkUnsub();}catch(_u){} _hkUnsub=null; }
  _hkUnsub=db.collection('campaigns').doc(state.sync.room).collection('state').doc('heckle')
    .onSnapshot(function(doc){ try{
      if(!doc.exists)return; var d=doc.data(); if(!d||!d.id)return;
      if(_hkSeen===d.id)return; _hkSeen=d.id;
      if(!d.ts||(Date.now()-d.ts)>15000)return;   /* a reload must not replay an old tomato */
      if(document.hidden)return;                  /* tabbed away: mark it seen, skip the show */
      if(hkMuted())return;
      hkSplat(d);
    }catch(_e){} }, function(e){ console.warn('heckle watch',e); });
}

function hkMuted(){ return !!((typeof RULES!=='undefined'&&RULES)?RULES.heckleOff:false); }
/* 🍅 you heckle from the cheap seats: any time you are NOT a competitor in the battle on screen.
   No live battle at all means everyone is a spectator, so the bar stays up between fights. */
function hkCanHeckle(){
  if(!(state.sync&&state.sync.on&&state.sync.room))return false;
  if(hkMuted())return false;
  if(!(typeof LIVECOMBAT!=='undefined'&&LIVECOMBAT&&LIVECOMBAT.active))return true;
  var me=(state.sync&&state.sync.pid)||'';
  return !((LIVECOMBAT.order||[]).some(function(c){ return c&&c.owner&&c.owner===me; }));
}
window.hkThrow=function(kind){
  if(!hkCanHeckle())return;
  var now=Date.now(); if(now-_hkLast<850)return; _hkLast=now;
  var o={id:hkUid(),pid:(state.sync&&state.sync.pid)||'',
    name:((state.trainer&&state.trainer.name)||'Someone'),kind:kind,
    x:12+Math.random()*76,y:16+Math.random()*54,ts:now};
  _hkSeen=o.id; hkSplat(o);                    /* land it locally now; the echo is ignored by id */
  try{ var db=fbInit(); if(db)db.collection('campaigns').doc(state.sync.room).collection('state').doc('heckle').set(o).catch(function(){}); }catch(_t){}
  hkBar(true);
};
function hkBar(bump){
  try{
    var bar=document.getElementById('hkBar');
    if(!hkCanHeckle()){ if(bar)bar.remove(); return; }
    if(!bar){
      bar=document.createElement('div'); bar.id='hkBar';
      bar.style.cssText='position:fixed;right:12px;bottom:14px;z-index:9991;display:flex;gap:6px;'
       +'padding:6px 7px;border-radius:12px;background:rgba(14,18,26,.82);border:1px solid #2c3342;'
       +'box-shadow:0 6px 20px rgba(0,0,0,.45);backdrop-filter:blur(6px)';
      [['tomato','🍅','Lob a tomato at the screen'],
       ['egg','🥚','Chuck an egg'],
       ['cheer','📣','Set off a cheer']].forEach(function(k){
        var b=document.createElement('button');
        b.type='button'; b.textContent=k[1]; b.title=k[2];
        b.style.cssText='font-size:19px;line-height:1;padding:5px 8px;border-radius:9px;cursor:pointer;'
         +'background:#182031;border:1px solid #2c3342;color:#dfe6ee;transition:transform .1s ease,background .15s ease';
        b.onmouseenter=function(){ b.style.background='#22304a'; b.style.transform='translateY(-1px)'; };
        b.onmouseleave=function(){ b.style.background='#182031'; b.style.transform='none'; };
        b.onclick=function(){ b.animate([{transform:'scale(1)'},{transform:'scale(.82)'},{transform:'scale(1)'}],{duration:180}); hkThrow(k[0]); };
        bar.appendChild(b);
      });
      document.body.appendChild(bar);
      bar.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'ease-out'});
    }
    if(bump)bar.animate([{transform:'translateY(0)'},{transform:'translateY(3px)'},{transform:'translateY(0)'}],{duration:200});
  }catch(_b){}
}

function fbWatchPong(){const db=fbInit();if(!db||!state.sync.room)return;if(_pgUnsub){_pgUnsub();_pgUnsub=null;}
  _pgUnsub=db.collection('campaigns').doc(state.sync.room).collection('state').doc('pong').onSnapshot(function(doc){
    var d=doc.exists?doc.data():null;
    if(!d||d.status==='idle'||!d.id||d.owner!==state.sync.pid){ if(PG&&(!d||d.id!==PG.id))pongClose(); return; }
    if(!PG||PG.id!==d.id){ PG={id:d.id,stake:d.stake||0,to:d.to||3,x:50}; pongShow(); }
    PG.bx=d.bx;PG.by=d.by;PG.vx=d.vx;PG.vy=d.vy;PG.dmX=d.dmX;PG.pw=(d.pw||11);PG.sDm=d.sDm;PG.sPl=d.sPl;PG.t=Date.now();

function pongShow(){

   +'<div id="pgSub" class="dim" style="font-size:12px;margin-bottom:8px"></div>'
   +'<canvas id="pgC" width="330" height="440" style="border:1px solid #3a4658;border-radius:10px;background:#0d1118;touch-action:none;max-width:96vw;max-height:70vh"></canvas>'
   +'<div id="pgS" style="font-size:26px;font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums"></div>'
   +'<div id="pgM" class="dim" style="font-size:13px;margin-top:2px;text-align:center">Drag to move your paddle. You cannot leave.</div>';
  document.body.appendChild(w);
  var sub=document.getElementById('pgSub');
  if(sub)sub.textContent=PG.stake?('₽'+PG.stake+' on the line · first to '+PG.to):('First to '+PG.to+' · nothing but pride');
  var c=document.getElementById('pgC');
  var move=function(e){ if(!PG||PG.status==='over')return; var r=c.getBoundingClientRect();
    var cx=e.touches?e.touches[0].clientX:e.clientX;

  var rows=(b.menu||[]).map(function(m){var pr=m.price||0;var can=(t.money||0)>=pr;
   return '<div class="loci" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="flex:1;min-width:0"><b>'+esc(m.species)+'</b> <span class="dim" style="font-size:11px">'+esc(m.rank)+breederTagP(m)+'</span></span><button class="btn sm '+(can?'pri':'')+'"'+(can?'':' disabled style="opacity:.45"')+' onclick="buyBreederMon(\''+b.id+'\',\''+m.id+'\')">₽'+pr+'</button></div>';}).join('');
  return '<div class="panel" style="margin-top:8px;border-left:3px solid #caa23a"><div class="row" style="justify-content:space-between;align-items:center"><b>🥚 '+esc(b.name)+'</b></div><div class="dim" style="font-size:11px;margin-top:2px">Buy a Pokémon — it joins your party.</div><div style="margin-top:6px">'+(rows||'<span class="dim">sold out</span>')+'</div></div>';
 }).join('')+'</div>';}
window.buyBreederMon=function(bid,mid){var brs=(SHOP&&SHOP.breeders)||[];var b=brs.find(function(x){return x.id===bid;});if(!b){alert('That breeder just closed.');renderShopP();return;}var m=(b.menu||[]).find(function(x){return x.id===mid;});if(!m){alert('That one just sold.');renderShopP();return;}var pr=breederPrice(m);
 if((state.trainer.money||0)<pr){alert('Not enough ₽ for that.');return;}
 if(!confirm('Buy '+m.species+' for ₽'+pr+'? It joins your party.'))return;
 var spec={species:m.species,rank:m.rank,nick:'',nature:m.nature||'',alpha:!!m.alpha,ability:m.ability||'',xmoves:(m.xmoves||[]).slice(),shiny:!!m.shiny,happiness:(m.happy!=null?m.happy:2),loyalty:(m.loy!=null?m.loy:1),chonk:(m.chonk||0)};
 var r;try{r=grantCatchMon(spec);}catch(e){r=null;}
 if(!r){alert('Could not add that Pokémon.');return;}
 state.trainer.money=(state.trainer.money||0)-pr;save();fbPush();render();
 var db=fbInit();if(db&&state.sync.room)db.collection('campaigns').doc(state.sync.room).collection('combat_actions').add({type:'buyMon',by:state.sync.pid,byName:whoAmI(),breederId:bid,listingId:mid,species:m.species,price:pr,ts:Date.now()}).catch(function(e){console.warn('buyMon',e);});
 try{b.menu=(b.menu||[]).filter(function(x){return x.id!==mid;});renderShopP();}catch(e){}flash('🥚 Bought '+(r.m.nick||r.m.species)+' — ₽'+pr+' → your '+r.where);}
function renderShopP(){const el=document.getElementById('shopModalBody');if(el)el.innerHTML=shopBodyHTML();}
function shopScreenInner(){if(!state.sync.room)return '<div class="note" style="padding:16px;text-align:center">🛒 Connect to your table first (🛰 Connect, top-right). Your DM opens the Poké Mart when you reach one.</div>';
  return `<h3>🛒 Shops</h3><div id="shopModalBody">${shopBodyHTML()}</div>`;}
window.openShopP=()=>go('shop');
function fbWatchLoot(){const db=fbInit();if(!db||!state.sync.room)return;if(_lootUnsub){_lootUnsub();_lootUnsub=null;}
  _lootUnsub=db.collection('campaigns').doc(state.sync.room).collection('state').doc('loot').onSnapshot(doc=>{const prev=LOOTPOOL.length;LOOTPOOL=(doc.exists&&doc.data().items)||[];if(LOOTPOOL.length>prev&&_lootSeen)flash('🎁 Loot dropped! Tap 🎁 Loot up top to claim.');_lootSeen=1;if(document.getElementById('lootPMark'))drawLootP();},err=>console.warn('loot watch',err));}
window.openLootP=()=>{if(!state.sync.room){alert('Connect to your table first (🛰 Connect, top-right).');return;}drawLootP();};
function drawLootP(){const items=LOOTPOOL.filter(it=>!_claimedLoot.includes(it.id));
  showModal(`<div class="row" style="justify-content:space-between"><h3>🎁 Loot</h3><button class="btn sm" onclick="closeModal()">✕</button></div><span id="lootPMark"></span>
    <div class="dim" style="font-size:12px;margin-top:4px">Items your DM dropped — tap <b>Take</b> to add one to your bag.</div>
    <div class="scroll" style="max-height:52vh;margin-top:8px">${items.length?items.map(it=>{const isMoney=!!it.money;return `<div class="hook" style="border-left-color:#caa23a"><div class="row" style="justify-content:space-between;align-items:center;gap:8px"><div><b>${isMoney?'💰 ':''}${esc(it.name)}</b> <span class="dim">· ${esc(isMoney?'PokéDollars':(it.cat||''))}</span>${(!isMoney&&it.desc)?`<div class="dim" style="font-size:11px">${esc(it.desc)}</div>`:''}</div><button class="btn sm pri" onclick="claimLoot('${it.id}')">${isMoney?'Take ₽':'Take'}</button></div></div>`;}).join(''):'<div class="note" style="margin-top:10px"><span class="dim">No loot up for grabs right now.</span></div>'}</div>
    <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" onclick="closeModal()">Done</button></div>`);}
window.claimLoot=id=>{const it=LOOTPOOL.find(x=>x.id===id);if(!it)return;const db=fbInit();if(!db||!state.sync.room){alert('Connect to your table first.');return;}
  _claimedLoot.push(id);
  if(it.money){state.trainer.money=(state.trainer.money||0)+it.money;}
  else{state.trainer.bag=state.trainer.bag||[];state.trainer.bag.push(it.name);}
  db.collection('campaigns').doc(state.sync.room).collection('loot_claims').add({itemId:id,name:it.name,by:state.sync.pid,byName:whoAmI(),ts:Date.now()}).catch(e=>console.warn('claim',e));
  save();fbPush();render();flash(it.money?('Pocketed '+it.name+' 💰 — now ₽'+(state.trainer.money||0)):('Took '+it.name+' 🎒'));drawLootP();};
window.buyItem=id=>{const it=(DB.items||[]).find(x=>x._id===id);if(!it)return;if(!SHOP.open){alert('The shop just closed.');renderShopP();return;}if(SHOP.curated&&!(SHOP.stock||[]).includes(it.Name)){alert('That item just went out of stock.');renderShopP();return;}if(SHOP.qty&&SHOP.qty[it.Name]!=null&&SHOP.qty[it.Name]<=0){alert(it.Name+' is SOLD OUT.');renderShopP();return;}const pr=shopPrice(it);
  if((state.trainer.money||0)<pr){alert('Not enough ₽ for that.');return;}
  state.trainer.money-=pr;state.trainer.bag=state.trainer.bag||[];state.trainer.bag.push(it.Name);save();render();
  const db=fbInit();if(db)db.collection('campaigns').doc(state.sync.room).collection('shop_log').add({who:whoAmI(),item:it.Name,price:pr,ts:Date.now()}).catch(e=>console.warn('buy',e));
  renderShopP();flash('Bought '+it.Name+' — ₽'+pr);}

render();setLiveStatus();try{cloudHydrate();}catch(_chb){} /* ☁ cloud-primary boot: pull the character's cloud copy first — "log in and it's there". If it adopts a newer copy, the room mirror re-pushes itself right after via importText→save. */
if(state.sync.on){try{cloudAutoEnable();}catch(_cab){} /* ☁ auto-enroll returning players who predate the cloud slot — zero taps needed */
fbPush();fbWatchCombat();fbWatchSafari();fbWatchGC();fbWatchRolls();fbWatchShop();fbWatchEvade();fbWatchPong();fbWatchHeckle();fbWatchStart();fbWatchSelf();fbWatchLoot();fbWatchLocation();fbWatchScene();fbWatchMusic();fbWatchRest();fbWatchMessages();fbWatchBadges();fbWatchContacts();fbWatchQuests();fbWatchContest();fbWatchTournament();fbWatchCelebrate();fbWatchTraining();fbWatchRules();fbWatchTrades();fbWatchRollReqs();}
</script>
